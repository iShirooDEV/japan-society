<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e0111f">
<title>Panel de owners · JAPAN Society™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070708;--bg2:#101012;--card:#141416;--line:#2b1518;--red:#e0111f;--red2:#ff3b4a;--ink:#f5f5f5;--mute:#a99ea0;--ok:#35c46d;--gold:#e8bd5c;
--head:'Montserrat','Segoe UI',system-ui,sans-serif;--body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#2a0a0e,transparent 60%),var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;min-height:100vh}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 18px;background:#070708e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top img{width:34px;height:34px;border-radius:50%}
.brand{font-family:var(--head);font-weight:800;letter-spacing:.06em}
.brand small{font-weight:300;letter-spacing:.02em;color:var(--mute)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--mute)}
.who img{width:30px;height:30px;border-radius:50%;border:2px solid var(--red)}
.btn{display:inline-block;padding:8px 18px;border-radius:99px;background:var(--red);color:#fff;text-decoration:none;font-family:var(--head);font-weight:700;font-size:.82rem;border:2px solid var(--red);cursor:pointer}
.btn:hover{box-shadow:0 6px 20px #e0111f55}
.btn.ghost{background:transparent;border-color:#ffffff40}
.btn.ghost:hover{border-color:var(--red2);box-shadow:none}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.center{max-width:520px;margin:12vh auto;padding:0 18px;text-align:center}
.center h1{font-family:var(--head);font-weight:800;margin:0 0 8px}
.center p{color:var(--mute)}
.layout{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px;max-width:1200px;margin:16px auto;padding:0 16px}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.pane{background:linear-gradient(160deg,#18181b,#101012);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:.8rem}
.tab.on{background:var(--red);border-color:var(--red)}
.list{display:grid;gap:8px;max-height:70vh;overflow:auto}
.item{display:grid;gap:2px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);cursor:pointer;font:inherit}
.item:hover{border-color:var(--red)}
.item.sel{border-color:var(--red2);box-shadow:0 0 0 1px var(--red2) inset}
.item b{font-family:var(--head);font-size:.92rem}
.item small,.muted{color:var(--mute);font-size:.8rem}
.badge{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute);width:max-content}
.badge.new{color:var(--red2);border-color:var(--red2)}
.badge.claimed{color:var(--gold);border-color:var(--gold)}
.badge.answered{color:var(--ok);border-color:var(--ok)}
.badge.closed{color:var(--mute)}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.detail h2{font-family:var(--head);font-size:1.25rem;margin:4px 0}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--mute);font-size:.85rem;margin-bottom:12px;align-items:center}
.body{white-space:pre-wrap;word-break:break-word;background:#0d0d0f;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.rep{border-left:3px solid var(--red);background:#120a0c;border-radius:0 12px 12px 0;padding:8px 14px;margin-top:10px}
.rep .t{white-space:pre-wrap;word-break:break-word}
.err,.okm{margin:10px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--red2)}
.okm{border-color:var(--ok)}
textarea{width:100%;min-height:120px;resize:vertical;background:#0d0d0f;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}
textarea:focus{outline:none;border-color:var(--red)}
h3{font-family:var(--head);font-size:.95rem;margin:16px 0 6px}
.nav{display:flex;gap:6px;margin-left:12px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:transparent;color:var(--mute);padding:6px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:.85rem}
.nav button.on{background:var(--red);border-color:var(--red);color:#fff}
.banner{margin:0 0 12px;padding:10px 14px;border-radius:12px;border:1px solid var(--gold);color:var(--gold);font-size:.88rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-family:var(--head);font-size:1.7rem;color:var(--red2);line-height:1.2}
.stat span{color:var(--mute);font-size:.8rem}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chart h3{margin-top:0}
.row{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;margin:6px 0;font-size:.82rem}
.row .lbl{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .track{background:#0d0d0f;border-radius:99px;height:10px;overflow:hidden;border:1px solid var(--line)}
.row .fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:99px}
.row .num{text-align:right}
.full{max-width:1200px;margin:16px auto;padding:0 16px}
.top .nav{margin-left:8px}
</style>
</head>
<body>
<div id="app"><div class="center"><p>Cargando…</p></div></div>

  var STATUS={'new':'Nuevo',claimed:'En atención',answered:'Respondido',closed:'Cerrado'};
  var DELIVERY={sent:'✅ Entregada por mensaje directo',closed_dms:'⚠️ Tiene los mensajes directos cerrados; la verá en la web',not_found:'⚠️ No se encontró al usuario',error:'⚠️ Falló el envío por mensaje directo',pending:'⏳ En cola: el bot la enviará en menos de un minuto'};
  var KIND={soporte:'Soporte',alianza:'Alianza',bot:'Pedir un bot',otro:'Otro'};
  var FILTERS=[['all','Todos'],['new','Nuevos'],['claimed','En atención'],['answered','Respondidos'],['closed','Cerrados']];
  var TFILTERS=[['open','Abiertos'],['closed','Cerrados'],['all','Todos']];
  var VIEWS=[['messages','Mensajes'],['tickets','Tickets'],['stats','Estadísticas']];
  var state={me:null,view:'messages',filter:'all',messages:[],selected:null,detail:null,draft:{},notice:null,
    board:null,fresh:true,age:null,tFilter:'open',tSelected:null,tNotice:null,tDraft:{},timer:null};
  var ui={};

  /* ---------- utilidades ---------- */
  function el(tag,attrs,kids){
    var e=document.createElement(tag);
    Object.keys(attrs||{}).forEach(function(k){
      var v=attrs[k];
      if(k==='text')e.textContent=v;else if(k==='value')e.value=v;else e.setAttribute(k,v);
    });
    (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
    return e;
  }
  function clear(node){while(node.firstChild)node.removeChild(node.firstChild)}
  function fmt(ts){
    if(!ts)return '';
    var ms=ts<1e11?ts*1000:ts;
    try{return new Date(ms).toLocaleString('es',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}
  }
  function fmtDur(sec){
    if(sec===null||sec===undefined||isNaN(sec))return '—';
    sec=Math.round(sec);
    if(sec<60)return sec+' s';
    var m=Math.round(sec/60);
    if(m<60)return m+' min';
    var h=Math.floor(m/60),rm=m%60;
    if(h<24)return h+' h'+(rm?' '+rm+' min':'');
    var d=Math.floor(h/24),rh=h%24;
    return d+' d'+(rh?' '+rh+' h':'');
  }
  function api(path,opts){
    opts=opts||{};opts.credentials='same-origin';
    return fetch(path,opts).then(function(r){return r.json().then(function(j){return {status:r.status,data:j}})});
  }
  function post(body){
    return api('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }
  function badge(status,text){return el('span',{'class':'badge '+status,text:text||STATUS[status]||status})}
  function confirmBox(text){return typeof window!=='undefined'&&window.confirm?window.confirm(text):true}

  function screen(title,text,links){
    clear(app);
    var box=el('div',{'class':'center'},[el('h1',{text:title}),el('p',{text:text})]);
    (links||[]).forEach(function(l){box.appendChild(el('a',{'class':l.ghost?'btn ghost':'btn',href:l.href,text:l.text}));box.appendChild(document.createTextNode(' '))});
    app.appendChild(box);
  }

  /* ================= MENSAJES ================= */
  function visible(){return state.messages.filter(function(m){return state.filter==='all'||m.status===state.filter})}
  function renderTabs(){
    clear(ui.tabs);
    FILTERS.forEach(function(f){
      var count=f[0]==='all'?state.messages.length:state.messages.filter(function(m){return m.status===f[0]}).length;
      var b=el('button',{'class':'tab'+(state.filter===f[0]?' on':''),type:'button',text:f[1]+' ('+count+')'});
      b.addEventListener('click',function(){state.filter=f[0];renderTabs();renderList()});
      ui.tabs.appendChild(b);
    });
  }
  function renderList(){
    clear(ui.list);
    var items=visible();
    if(!items.length){ui.list.appendChild(el('div',{'class':'empty',text:'No hay mensajes en esta vista.'}));return}
    items.forEach(function(m){
      var b=el('button',{'class':'item'+(state.selected===m.id?' sel':''),type:'button'},[
        el('b',{text:m.subject||'(sin asunto)'}),
        el('small',{text:'De '+m.name+' · '+fmt(m.created)}),
        badge(m.status),
        el('small',{text:m.claimed_name?'Atiende: '+m.claimed_name:'Sin atender'})
      ]);
      b.addEventListener('click',function(){select(m.id)});
      ui.list.appendChild(b);
    });
  }
  function loadList(){
    return api('/api/admin?action=list').then(function(r){
      if(r.status===401||r.status===403){init();return}
      if(r.status!==200)return;
      state.messages=r.data.messages||[];
      if(state.view==='messages'&&ui.list){renderTabs();renderList()}
      if(state.view==='stats'&&ui.stats)renderStats();
    }).catch(function(){});
  }
  function select(id){state.selected=id;state.notice=null;renderList();return loadDetail()}
  function loadDetail(){
    if(!state.selected)return Promise.resolve();
    var id=state.selected;
    return api('/api/admin?action=get&id='+encodeURIComponent(id)).then(function(r){
      if(state.selected!==id||state.view!=='messages')return;
      if(r.status!==200){state.detail=null;state.notice={err:true,text:r.data.message||'No se pudo cargar el mensaje.'};renderDetail();return}
      state.detail=r.data;renderDetail();
    }).catch(function(){state.notice={err:true,text:'No se pudo cargar el mensaje.'};renderDetail()});
  }
  function act(body,okText){
    return post(body).then(function(r){
      if(r.status===200){state.notice={err:false,text:okText};if(body.action==='reply')delete state.draft[body.id];return Promise.all([loadList(),loadDetail()])}
      if(r.status===401||r.status===403){init();return}
      state.notice={err:true,text:r.data.message||'No se pudo completar la acción.'};renderDetail();
    }).catch(function(){state.notice={err:true,text:'No se pudo completar la acción.'};renderDetail()});
  }
  function renderDetail(){
    clear(ui.detail);
    if(!state.selected){ui.detail.appendChild(el('div',{'class':'empty',text:'Elige un mensaje de la lista para verlo y responder.'}));return}
    if(!state.detail){if(state.notice)ui.detail.appendChild(el('div',{'class':'err',text:state.notice.text}));return}
    var m=state.detail.message,me=state.me;
    var box=el('div',{'class':'detail'});
    box.appendChild(el('h2',{text:m.subject||'(sin asunto)'}));
    box.appendChild(el('div',{'class':'meta'},[
      badge(m.status),
      el('span',{text:'De '+m.name+' (@'+m.username+' · '+m.user_id+')'}),
      el('span',{text:fmt(m.created)}),
      el('span',{text:m.claimed_name?'Atiende: '+m.claimed_name:'Sin atender'})
    ]));
    box.appendChild(el('div',{'class':'body',text:m.message}));
    if(state.notice)box.appendChild(el('div',{'class':state.notice.err?'err':'okm',text:state.notice.text}));

    var actions=el('div',{'class':'actions'});
    if(m.status!=='closed'){
      if(!m.claimed_by){
        var a=el('button',{'class':'btn',type:'button',text:'Atender'});
        a.addEventListener('click',function(){act({action:'claim',id:m.id},'Ahora atiendes este mensaje.')});
        actions.appendChild(a);
      }else if(m.claimed_by!==me.id){
        var t=el('button',{'class':'btn ghost',type:'button',text:'Tomar (lo atiende '+m.claimed_name+')'});
        t.addEventListener('click',function(){
          if(confirmBox('¿Tomar este mensaje? Lo atiende '+m.claimed_name+'.'))act({action:'takeover',id:m.id},'Ahora atiendes este mensaje.');
        });
        actions.appendChild(t);
      }
      var c=el('button',{'class':'btn ghost',type:'button',text:'Cerrar'});
      c.addEventListener('click',function(){
        if(confirmBox('¿Cerrar este mensaje? Ya no se podrá responder.'))act({action:'close',id:m.id},'Mensaje cerrado.');
      });
      actions.appendChild(c);
    }
    box.appendChild(actions);

    box.appendChild(el('h3',{text:'Respuestas ('+state.detail.replies.length+')'}));
    if(!state.detail.replies.length)box.appendChild(el('div',{'class':'muted',text:'Todavía no hay respuestas.'}));
    state.detail.replies.forEach(function(r){
      box.appendChild(el('div',{'class':'rep'},[
        el('div',{'class':'muted',text:r.by_name+' · '+fmt(r.at)}),
        el('div',{'class':'t',text:r.text}),
        el('div',{'class':'muted',text:DELIVERY[r.delivery]||r.delivery})
      ]));
    });

    if(m.status!=='closed'){
      var canReply=!m.claimed_by||m.claimed_by===me.id;
      box.appendChild(el('h3',{text:'Responder'}));
      if(!canReply){
        box.appendChild(el('div',{'class':'muted',text:'Lo atiende '+m.claimed_name+'. Pulsa «Tomar» si quieres responder tú.'}));
      }else{
        var ta=el('textarea',{maxlength:'1800',placeholder:'Escribe la respuesta. El bot se la enviará al usuario por mensaje directo de Discord.',value:state.draft[m.id]||''});
        ta.addEventListener('input',function(){state.draft[m.id]=ta.value});
        var send=el('button',{'class':'btn',type:'button',text:'Enviar respuesta por Discord'});
        send.addEventListener('click',function(){
          var text=String(ta.value||'').trim();
          if(!text){state.notice={err:true,text:'Escribe una respuesta antes de enviar.'};renderDetail();return}
          send.disabled=true;
          act({action:'reply',id:m.id,text:text},'Respuesta enviada. El bot la entregará al usuario en menos de un minuto.').then(function(){
            setTimeout(function(){loadDetail()},25000);
          });
        });
        box.appendChild(ta);
        box.appendChild(el('div',{'class':'actions'},[send]));
      }
    }
    ui.detail.appendChild(box);
  }
  function buildMessages(){
    ui.tabs=el('div',{'class':'tabs'});
    ui.list=el('div',{'class':'list'});
    ui.detail=el('div',{'class':'pane'});
    ui.stats=null;
    var refresh=el('button',{'class':'tab',type:'button',text:'↻ Actualizar'});
    refresh.addEventListener('click',function(){loadList()});
    ui.main.appendChild(el('div',{'class':'layout'},[
      el('div',{'class':'pane'},[ui.tabs,ui.list,el('div',{'class':'actions'},[refresh])]),
      ui.detail
    ]));
    renderTabs();renderList();renderDetail();
    loadList();
  }

  /* ================= TICKETS DE DISCORD ================= */
  function allTickets(){
    var b=state.board;
    if(!b)return [];
    var open=(b.open||[]).map(function(t){t._open=true;return t});
    var closed=(b.closed||[]).map(function(t){t._open=false;return t});
    if(state.tFilter==='open')return open;
    if(state.tFilter==='closed')return closed;
    return open.concat(closed);
  }
  function findTicket(id){
    var b=state.board;
    if(!b)return null;
    var all=(b.open||[]).concat(b.closed||[]);
    for(var i=0;i<all.length;i++){if(all[i].channel_id===id){all[i]._open=(b.open||[]).indexOf(all[i])!==-1;return all[i]}}
    return null;
  }
  function ticketTitle(t){return '#'+String(t.number||0).padStart(4,'0')+' · '+(KIND[t.kind]||t.kind||'Ticket')}
  function renderTicketTabs(){
    clear(ui.ttabs);
    var b=state.board||{open:[],closed:[]};
    TFILTERS.forEach(function(f){
      var count=f[0]==='open'?(b.open||[]).length:f[0]==='closed'?(b.closed||[]).length:(b.open||[]).length+(b.closed||[]).length;
      var x=el('button',{'class':'tab'+(state.tFilter===f[0]?' on':''),type:'button',text:f[1]+' ('+count+')'});
      x.addEventListener('click',function(){state.tFilter=f[0];renderTicketTabs();renderTicketList()});
      ui.ttabs.appendChild(x);
    });
  }
  function renderBanner(){
    clear(ui.banner);
    if(!state.board){ui.banner.appendChild(el('div',{'class':'banner',text:'El bot todavía no ha publicado los tickets. Comprueba que esté encendido y que tenga la versión nueva.'}));return}
    if(!state.fresh)ui.banner.appendChild(el('div',{'class':'banner',text:'Los datos son de hace '+fmtDur(state.age)+': el bot puede estar apagado.'}));
  }
  function renderTicketList(){
    clear(ui.tlist);
    var items=allTickets();
    if(!items.length){ui.tlist.appendChild(el('div',{'class':'empty',text:'No hay tickets en esta vista.'}));return}
    items.forEach(function(t){
      var st=t._open?(t.claimed_name?'Atiende: '+t.claimed_name:'Sin atender'):'Cerrado'+(t.closed_name?' por '+t.closed_name:'');
      var b=el('button',{'class':'item'+(state.tSelected===t.channel_id?' sel':''),type:'button'},[
        el('b',{text:ticketTitle(t)}),
        el('small',{text:(t.owner_name||'Usuario')+' · '+fmt(t.created)+(t.web?' · 🌐 Web':'')}),
        badge(t._open?(t.claimed_by?'claimed':'new'):'closed',t._open?(t.claimed_by?'En atención':'Abierto'):'Cerrado'),
        el('small',{text:st})
      ]);
      b.addEventListener('click',function(){state.tSelected=t.channel_id;state.tNotice=null;renderTicketList();renderTicketDetail()});
      ui.tlist.appendChild(b);
    });
  }
  function loadBoard(){
    return api('/api/admin?action=tickets').then(function(r){
      if(r.status===401||r.status===403){init();return}
      if(r.status!==200)return;
      state.board=r.data.board||null;state.fresh=!!r.data.fresh;state.age=r.data.age_seconds;
      if(state.view==='tickets'&&ui.tlist){renderBanner();renderTicketTabs();renderTicketList();renderTicketDetail()}
      if(state.view==='stats'&&ui.stats)renderStats();
    }).catch(function(){});
  }
  function pollJob(id,tries){
    return api('/api/admin?action=jobresult&id='+encodeURIComponent(id)).then(function(r){
      if(r.status===200&&r.data.status&&r.data.status!=='pending')return r.data;
      if(tries>=15)return {status:'error',message:'El bot tardó demasiado en responder. Revisa Discord y actualiza en un momento.'};
      return new Promise(function(res){setTimeout(res,3000)}).then(function(){return pollJob(id,tries+1)});
    });
  }
  function applyLocal(t,action){
    var now=Math.floor(Date.now()/1000),me=state.me,b=state.board;
    if(!t.claimed_by){t.claimed_by=me.id;t.claimed_name=me.name;t.claimed_at=now}
    if(action==='t_close'&&b){
      b.open=(b.open||[]).filter(function(x){return x.channel_id!==t.channel_id});
      t.closed_at=now;t.closed_name=me.name;
      b.closed=[t].concat(b.closed||[]);
      state.tFilter=state.tFilter==='open'?'closed':state.tFilter;
    }
  }
  function ticketAct(t,action,text){
    state.tNotice={err:false,text:'Enviando al bot…'};renderTicketDetail();
    var body={action:action,channel_id:t.channel_id};
    if(action==='t_reply')body.text=text;
    return post(body).then(function(r){
      if(r.status===401||r.status===403){init();return}
      if(r.status!==202){state.tNotice={err:true,text:r.data.message||'No se pudo enviar la acción.'};renderTicketDetail();return}
      return pollJob(r.data.job_id,0).then(function(res){
        if(res.status==='ok'){
          applyLocal(t,action);
          if(action==='t_reply')delete state.tDraft[t.channel_id];
          state.tNotice={err:false,text:res.message||'Hecho.'};
          renderTicketTabs();renderTicketList();renderTicketDetail();
          setTimeout(function(){loadBoard()},18000);
        }else{
          state.tNotice={err:true,text:res.message||'El bot no pudo completar la acción.'};renderTicketDetail();
        }
      });
    }).catch(function(){state.tNotice={err:true,text:'No se pudo enviar la acción.'};renderTicketDetail()});
  }
  function renderTicketDetail(){
    clear(ui.tdetail);
    var t=state.tSelected?findTicket(state.tSelected):null;
    if(!t){ui.tdetail.appendChild(el('div',{'class':'empty',text:'Elige un ticket de la lista para verlo y gestionarlo.'}));return}
    var me=state.me,box=el('div',{'class':'detail'});
    box.appendChild(el('h2',{text:'Ticket '+ticketTitle(t)}));
    var meta=[
      badge(t._open?(t.claimed_by?'claimed':'new'):'closed',t._open?(t.claimed_by?'En atención':'Abierto'):'Cerrado'),
      el('span',{text:'De '+(t.owner_name||'Usuario')+' ('+t.owner_id+')'}),
      el('span',{text:fmt(t.created)}),
      el('span',{text:t.web?'🌐 Abierto desde la web':'💬 Abierto en Discord'}),
      el('span',{text:t.claimed_name?'Atiende: '+t.claimed_name:'Sin atender'})
    ];
    if(!t._open){meta.push(el('span',{text:'Cerrado'+(t.closed_name?' por '+t.closed_name:'')+(t.closed_at?' · '+fmt(t.closed_at)+' · duró '+fmtDur(t.closed_at-t.created):'')}))}
    box.appendChild(el('div',{'class':'meta'},meta));
    if(t.subject)box.appendChild(el('div',{'class':'body',text:t.subject}));
    if(state.tNotice)box.appendChild(el('div',{'class':state.tNotice.err?'err':'okm',text:state.tNotice.text}));

    var actions=el('div',{'class':'actions'});
    if(t._open){
      if(state.board&&state.board.guild_id)actions.appendChild(el('a',{'class':'btn ghost',href:'https://discord.com/channels/'+state.board.guild_id+'/'+t.channel_id,target:'_blank',rel:'noopener',text:'Abrir en Discord'}));
      if(!t.claimed_by){
        var a=el('button',{'class':'btn',type:'button',text:'Atender'});
        a.addEventListener('click',function(){ticketAct(t,'t_claim')});
        actions.appendChild(a);
      }
      var c=el('button',{'class':'btn ghost',type:'button',text:'Cerrar ticket'});
      c.addEventListener('click',function(){
        if(confirmBox('¿Cerrar este ticket? Se guardará la transcripción en el canal de logs y se eliminará el canal.'))ticketAct(t,'t_close');
      });
      actions.appendChild(c);
    }
    box.appendChild(actions);

    if(t._open){
      box.appendChild(el('h3',{text:'Responder en el ticket'}));
      if(t.claimed_by&&t.claimed_by!==me.id){
        box.appendChild(el('div',{'class':'muted',text:'Lo atiende '+(t.claimed_name||'otro miembro del staff')+'. Solo quien atiende un ticket puede responder desde aquí.'}));
      }else{
        var ta=el('textarea',{maxlength:'1500',placeholder:'Escribe la respuesta. El bot la publicará dentro del ticket y mencionará al usuario.',value:state.tDraft[t.channel_id]||''});
        ta.addEventListener('input',function(){state.tDraft[t.channel_id]=ta.value});
        var send=el('button',{'class':'btn',type:'button',text:'Enviar respuesta al ticket'});
        send.addEventListener('click',function(){
          var text=String(ta.value||'').trim();
          if(!text){state.tNotice={err:true,text:'Escribe una respuesta antes de enviar.'};renderTicketDetail();return}
          send.disabled=true;ticketAct(t,'t_reply',text);
        });
        box.appendChild(ta);
        box.appendChild(el('div',{'class':'actions'},[send]));
      }
    }
    ui.tdetail.appendChild(box);
  }
  function buildTickets(){
    ui.ttabs=el('div',{'class':'tabs'});
    ui.tlist=el('div',{'class':'list'});
    ui.tdetail=el('div',{'class':'pane'});
    ui.banner=el('div');
    ui.stats=null;
    var refresh=el('button',{'class':'tab',type:'button',text:'↻ Actualizar'});
    refresh.addEventListener('click',function(){loadBoard()});
    ui.main.appendChild(el('div',{'class':'layout'},[
      el('div',{'class':'pane'},[ui.banner,ui.ttabs,ui.tlist,el('div',{'class':'actions'},[refresh])]),
      ui.tdetail
    ]));
    renderBanner();renderTicketTabs();renderTicketList();renderTicketDetail();
    loadBoard();
  }

  /* ================= ESTADÍSTICAS ================= */
  function bars(title,rows){
    var box=el('div',{'class':'pane chart'},[el('h3',{text:title})]);
    var max=0;rows.forEach(function(r){if(r[1]>max)max=r[1]});
    if(!rows.length||!max){box.appendChild(el('div',{'class':'muted',text:'Todavía no hay datos.'}));return box}
    rows.forEach(function(r){
      box.appendChild(el('div',{'class':'row'},[
        el('span',{'class':'lbl',text:r[0]}),
        el('div',{'class':'track'},[el('div',{'class':'fill',style:'width:'+Math.max(2,Math.round(r[1]/max*100))+'%'})]),
        el('span',{'class':'num',text:String(r[1])})
      ]));
    });
    return box;
  }
  function stat(value,label){return el('div',{'class':'stat'},[el('b',{text:String(value)}),el('span',{text:label})])}
  function renderStats(){
    clear(ui.stats);
    var b=state.board,s=b&&b.stats?b.stats:null,msgs=state.messages;
    if(!b)ui.stats.appendChild(el('div',{'class':'banner',text:'Aún no hay datos de tickets: el bot todavía no los ha publicado.'}));
    else if(!state.fresh)ui.stats.appendChild(el('div',{'class':'banner',text:'Los datos de tickets son de hace '+fmtDur(state.age)+': el bot puede estar apagado.'}));

    var replied=msgs.filter(function(m){return m.first_reply_at>0&&m.created>0&&m.first_reply_at>=m.created});
    var avgReply=replied.length?replied.reduce(function(a,m){return a+(m.first_reply_at-m.created)/1000},0)/replied.length:null;
    var answered=msgs.filter(function(m){return m.status==='answered'||m.status==='closed'}).length;
    ui.stats.appendChild(el('div',{'class':'cards'},[
      stat(s?s.open:'—','Tickets abiertos'),
      stat(s?s.closed:'—','Tickets cerrados'),
      stat(s?fmtDur(s.avg_first_response_s):'—','Primera respuesta en tickets'),
      stat(s?fmtDur(s.avg_close_s):'—','Duración media de un ticket'),
      stat(msgs.length,'Mensajes a owners'),
      stat(answered,'Mensajes respondidos'),
      stat(fmtDur(avgReply),'Primera respuesta a mensajes')
    ]));

    var kinds=s?Object.keys(s.by_kind||{}).map(function(k){return [KIND[k]||k,s.by_kind[k]]}):[];
    var days=[];
    if(s){
      for(var i=13;i>=0;i--){
        var d=new Date(Date.now()-i*86400000),key=d.toISOString().slice(0,10);
        days.push([key.slice(5),(s.by_day||{})[key]||0]);
      }
    }
    var owners=s?Object.keys(s.by_owner||{}).map(function(k){return [k,s.by_owner[k]]}).sort(function(a,b2){return b2[1]-a[1]}):[];
    var byStatus=['new','claimed','answered','closed'].map(function(k){return [STATUS[k],msgs.filter(function(m){return m.status===k}).length]});
    ui.stats.appendChild(el('div',{'class':'charts'},[
      bars('Tickets por tipo',kinds),
      bars('Tickets creados · últimos 14 días',days),
      bars('Tickets atendidos por owner',owners),
      bars('Mensajes por estado',byStatus)
    ]));
  }
  function buildStats(){
    ui.stats=el('div',{'class':'full'});
    ui.list=null;ui.tlist=null;
    ui.main.appendChild(ui.stats);
    renderStats();
    Promise.all([loadList(),loadBoard()]);
  }

  /* ================= ESTRUCTURA ================= */
  function renderNav(){
    clear(ui.nav);
    VIEWS.forEach(function(v){
      var b=el('button',{'class':state.view===v[0]?'on':'',type:'button',text:v[1]});
      b.addEventListener('click',function(){setView(v[0])});
      ui.nav.appendChild(b);
    });
  }
  function setView(v){
    state.view=v;
    renderNav();
    clear(ui.main);
    if(v==='messages')buildMessages();
    else if(v==='tickets')buildTickets();
    else buildStats();
  }
  function refreshCurrent(){
    if(typeof document!=='undefined'&&document.hidden)return;
    if(state.view==='messages')loadList();
    else if(state.view==='tickets')loadBoard();
    else{loadList();loadBoard()}
  }
  function build(){
    clear(app);
    ui.nav=el('div',{'class':'nav'});
    ui.main=el('div');
    app.appendChild(el('div',{'class':'top'},[
      el('img',{src:LOGO,alt:'Logo de JAPAN Society'}),
      el('span',{'class':'brand'},[document.createTextNode('JAPAN '),el('small',{text:'Society™ · Panel de owners'})]),
      ui.nav,
      el('div',{'class':'who'},[el('img',{src:state.me.avatar,alt:'Tu avatar'}),el('span',{text:state.me.name}),el('a',{'class':'btn ghost',href:'/api/logout',text:'Salir'})])
    ]));
    app.appendChild(ui.main);
    setView(state.view);
    if(state.timer)clearInterval(state.timer);
    state.timer=setInterval(refreshCurrent,60000);
  }
  function init(){
    if(state.timer){clearInterval(state.timer);state.timer=null}
    var failed=new URLSearchParams(location.search).get('login')==='error';
    api('/api/admin?action=me').then(function(r){
      if(r.status===401)return screen('Panel de owners',failed?'No pudimos iniciar tu sesión. Inténtalo de nuevo.':'Inicia sesión con Discord para entrar.',[{href:'/api/login?next=admin',text:'Iniciar sesión con Discord'}]);
      if(r.status===403)return screen('Sin acceso','Tu cuenta de Discord no es owner de JAPAN Society™.',[{href:'/api/logout',text:'Cerrar sesión',ghost:true},{href:'/',text:'Volver a la web',ghost:true}]);
      if(r.status!==200||!r.data.owner)return screen('No disponible','El panel no está disponible en este momento (código '+r.status+'). Abre /api/health para ver qué falta.',[{href:'/api/health',text:'Ver diagnóstico',ghost:true},{href:'/',text:'Volver a la web',ghost:true}]);
      state.me=r.data;build();
    }).catch(function(){screen('No disponible','El panel no está disponible en este momento.',[{href:'/',text:'Volver a la web',ghost:true}])});
  }
  init();
})();
</script>
</body>
