<html lang="es">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Verificación · JAPAN Society™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070708;--card:#141416;--line:#2b1518;--red:#e0111f;--red2:#ff3b4a;--ink:#f5f5f5;--mute:#a99ea0;--ok:#35c46d;
--head:'Montserrat','Segoe UI',system-ui,sans-serif;--body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 0,#2a0a0e,transparent 62%),var(--bg);color:var(--ink);font-family:var(--body);line-height:1.65}
.wrap{width:100%;max-width:520px}
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,#18181b,#101012);border:1px solid var(--line);border-radius:20px;padding:30px 26px;text-align:center;box-shadow:0 20px 60px #e0111f1f}
.card::after{content:"認証";position:absolute;right:-8px;bottom:-34px;font-family:var(--head);font-weight:800;font-size:7rem;opacity:.05;pointer-events:none}
.logo{width:84px;height:84px;border-radius:50%;border:3px solid var(--red);box-shadow:0 0 40px #e0111f66}
.eyebrow{font-family:var(--head);font-size:.72rem;letter-spacing:.3em;color:var(--red2);font-weight:700;margin:14px 0 2px}
h1{font-family:var(--head);font-weight:800;font-size:1.9rem;margin:0 0 10px}
p{color:var(--mute);margin:0 0 14px}
.btn{display:inline-block;padding:12px 26px;border-radius:99px;background:var(--red);color:#fff;text-decoration:none;font-family:var(--head);font-weight:700;font-size:.92rem;border:2px solid var(--red);cursor:pointer}
.btn:hover{box-shadow:0 8px 24px #e0111f55}
.btn.ghost{background:transparent;border-color:#ffffff40}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.me{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;color:var(--ink)}
.me img{width:40px;height:40px;border-radius:50%;border:2px solid var(--red)}
.msg{margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-align:left}
.msg.ok{border-color:var(--ok)}
.msg.err{border-color:var(--red2)}
.steps{text-align:left;color:var(--mute);margin:0 0 16px;padding-left:20px}
.cf{display:flex;justify-content:center;margin:0 0 14px;min-height:65px}
small{color:var(--mute)}
a.back{display:inline-block;margin-top:16px;color:var(--mute);font-size:.85rem}
</style>
</head>

    <p class="eyebrow">JAPAN SOCIETY™</p>
    <h1>Verificación</h1>
    <div id="vf"><p>Cargando…</p></div>
  </div>
  <p style="text-align:center;margin-top:14px"><a class="back" href="/">← Volver a la web</a></p>
</div>
<script>
(function(){
  var root=document.getElementById('vf');
  var INVITE='https://discord.gg/PUWcrVAjgJ';
  var siteKey='',token='',widget=null;
  function el(tag,attrs,kids){
    var e=document.createElement(tag);
    Object.keys(attrs||{}).forEach(function(k){if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k])});
    (kids||[]).forEach(function(c){e.appendChild(typeof c==='string'?document.createTextNode(c):c)});
    return e;
  }
  function show(nodes){while(root.firstChild)root.removeChild(root.firstChild);nodes.forEach(function(n){root.appendChild(n)})}
  function msg(text,cls){return el('div',{'class':'msg '+(cls||''),text:text})}
  function link(text,href,cls,newTab){
    var a=el('a',{'class':cls||'btn',href:href,text:text});
    if(newTab){a.setAttribute('target','_blank');a.setAttribute('rel','noopener')}
    return a;
  }
  function api(path,opts){
    opts=opts||{};opts.credentials='same-origin';
    return fetch(path,opts).then(function(r){return r.json().then(function(j){return {status:r.status,data:j}})});
  }

  function unavailable(){
    show([msg('La verificación no está disponible en este momento. Inténtalo de nuevo en unos minutos o avisa al staff por Discord.','err'),link('Ir al Discord',INVITE,'btn ghost',true)]);
  }
  function loggedOut(note){
    var nodes=[];
    if(note)nodes.push(msg(note,'err'));
    nodes.push(el('p',{text:'Para entrar al resto del servidor, inicia sesión con tu cuenta de Discord y comprueba que eres una persona. Solo usamos tu nombre e ID de Discord.'}));
    nodes.push(el('div',{'class':'row'},[link('Iniciar sesión con Discord','/api/login?next=verify'),link('Unirme al servidor',INVITE,'btn ghost',true)]));
    show(nodes);
  }
  function loadTurnstile(container,onToken){
    return new Promise(function(resolve,reject){
      if(window.turnstile){resolve();return}
      var s=document.createElement('script');
      s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.async=true;s.onload=resolve;s.onerror=function(){reject(new Error('turnstile'))};
      document.head.appendChild(s);
    }).then(function(){
      widget=window.turnstile.render(container,{sitekey:siteKey,theme:'dark',
        callback:function(t){onToken(t)},'expired-callback':function(){onToken('')},'error-callback':function(){onToken('')}});
    });
  }
  function resetWidget(){
    token='';
    try{if(widget!==null&&window.turnstile)window.turnstile.reset(widget)}catch(e){}
  }

  function done(data){
    var nodes=[];
    if(data.status==='ok'){
      nodes.push(msg(data.message||'¡Listo! Ya estás verificado.','ok'));
      nodes.push(link('Volver a Discord','https://discord.com/app','btn',true));
    }else{
      nodes.push(msg(data.message||'No se pudo completar la verificación.','err'));
      var row=el('div',{'class':'row'});
      if(data.code==='not_member')row.appendChild(link('Unirme al servidor',INVITE,'btn',true));
      var again=el('button',{'class':'btn ghost',type:'button',text:'Intentar de nuevo'});
      again.addEventListener('click',function(){resetWidget();init(true)});
      row.appendChild(again);
      nodes.push(row);
    }
    show(nodes);
  }
  function poll(id,tries){
    return api('/api/verify?id='+encodeURIComponent(id)).then(function(r){
      if(r.status===200&&r.data.status&&r.data.status!=='pending')return r.data;
      if(tries>=30)return {status:'error',message:'El bot está tardando en responder. Revisa Discord en un momento: si ya te dio el rol, estás verificado.'};
      return new Promise(function(res){setTimeout(res,2000)}).then(function(){return poll(id,tries+1)});
    });
  }

  function form(user){
    var status=el('div');
    var btn=el('button',{'class':'btn',type:'button',text:'Verificarme'});
    var cf=el('div',{'class':'cf'});
    if(siteKey)btn.disabled=true;
    btn.addEventListener('click',function(){
      btn.disabled=true;
      while(status.firstChild)status.removeChild(status.firstChild);
      status.appendChild(msg('Verificando… esto puede tardar unos segundos.'));
      api('/api/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})})
      .then(function(r){
        if(r.status===401){loggedOut('Tu sesión expiró. Inicia sesión de nuevo.');return null}
        if(r.status!==202)throw new Error(r.data.message||'No se pudo iniciar la verificación.');
        return poll(r.data.job_id,0).then(done);
      })
      .catch(function(e){
        while(status.firstChild)status.removeChild(status.firstChild);
        status.appendChild(msg(e.message||'No se pudo iniciar la verificación.','err'));
        resetWidget();btn.disabled=!!siteKey;
      });
    });
    var nodes=[
      el('div',{'class':'me'},[el('img',{src:user.avatar,alt:'Tu avatar de Discord'}),el('span',{text:'Hola, '+user.name})]),
      el('ol',{'class':'steps'},[el('li',{text:siteKey?'Resuelve la comprobación de abajo.':'Pulsa el botón de abajo.'}),el('li',{text:'Recibirás el rol de verificado en unos segundos.'})])
    ];
    if(siteKey)nodes.push(cf);
    nodes.push(status);
    nodes.push(el('div',{'class':'row'},[btn]));
    nodes.push(el('p',{'class':'small'},[el('small',{text:'¿No eres '+user.name+'? '}),link('Cerrar sesión','/api/logout','back')]));
    show(nodes);
    if(siteKey){
      loadTurnstile(cf,function(t){token=t;btn.disabled=!t}).catch(function(){
        status.appendChild(msg('No se pudo cargar la comprobación anti-bots. Recarga la página.','err'));
      });
    }
  }

  function init(skipKey){
    var failed=new URLSearchParams(location.search).get('login')==='error';
    var keyReq=skipKey?Promise.resolve():api('/api/verify').then(function(r){if(r.status===200)siteKey=r.data.turnstile_site_key||''}).catch(function(){});
    return keyReq.then(function(){return api('/api/me')}).then(function(r){
      if(r.status!==200)return unavailable();
      if(!r.data.logged)return loggedOut(failed?'No pudimos iniciar tu sesión. Inténtalo de nuevo.':'');
      form(r.data);
    }).catch(unavailable);
  }
  init(false);
})();
</script>
</body>
